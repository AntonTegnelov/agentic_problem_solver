name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install click python-dotenv langchain langchain-core google-generativeai pytest pytest-cov pytest-asyncio ruff toml tomli

      - name: Run pytest with coverage
        run: |
          python -m pytest --doctest-modules --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=36

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: true
