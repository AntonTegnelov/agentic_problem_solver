name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install click python-dotenv langchain langchain-core google-generativeai pytest pytest-cov pytest-asyncio ruff toml tomli

      - name: Create .env file for testing
        run: |
          cp .env.example .env
          echo "GEMINI_API_KEY=dummy_key_for_testing" >> .env

      - name: Run ruff check and fix
        run: |
          ruff check . --select=E,F,W,I,N,UP,B,A,C4,T20,PT,RET,SIM,ERA,PL,RUF --target-version=py312 --fix

      - name: Run pytest with coverage
        run: |
          python -m pytest --doctest-modules --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=36

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: true
