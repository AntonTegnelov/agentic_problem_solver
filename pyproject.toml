[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-problem-solver"
version = "0.1.0"
authors = [
    { name="Anton Tegnelöv", email="anton.tegnelov@gmail.com" },
]
description = "An AI-powered problem-solving system"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click",
    "python-dotenv",
    "langchain",
    "langchain-core",
    "google-generativeai",
    "pytest",
    "ruff",
]

[project.scripts]
APS = "src.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
extend-safe-fixes = ["ALL"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # Use of assert in tests
    "PLR2004", # Magic numbers in tests
    "FBT001",  # Boolean positional arg in function definition
    "FBT002",  # Boolean default value in function definition
    "SLF001",  # Private member accessed in tests
]